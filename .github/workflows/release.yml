name: release

# Reusable workflow consumers call from their own release.yml.
#
# v0.4 architecture (multi-job DAG):
#
#     ┌──────────┐    ┌──────────┐
#     │ build-a  │    │ build-b  │      both run all the way through
#     │ (full    │    │ (build + │      `record-tarball`, but only
#     │  gates)  │    │  pack)   │      build-a runs the gates.
#     └────┬─────┘    └────┬─────┘
#          │               │
#          └──────┬────────┘
#                 │
#           ┌─────▼─────┐
#           │ reproduce │   compare tarball.meta sha256s.
#           │           │   strict mode dies on mismatch;
#           │           │   warn mode emits a step output.
#           └─────┬─────┘
#                 │
#           ┌─────▼─────┐
#           │  publish  │   downloads tarball-A, publishes that
#           │           │   exact tarball, updates GH Release.
#           └───────────┘
#
# Why split: a single sha256 from a single runner is an integrity
# anchor, not a reproducibility proof. Two parallel builds on
# independent runners that produce byte-identical tarballs is the
# stronger claim. See docs/design/reproducible-build.md for the
# rationale and the trade-offs.
#
# Two caller patterns are supported:
#
# 1. Manual (maintainer creates the GitHub Release, that event fires
#    this workflow):
#
#      name: release
#      on:
#        release:
#          types: [published]
#      permissions:
#        contents: write
#        id-token: write
#      jobs:
#        release:
#          uses: forgesworn/anvil/.github/workflows/release.yml@v0
#          with:
#            vector-test-command: npm run test:vectors
#
# 2. Chained (auto-release.yml pushes a tag and calls this workflow
#    directly via workflow_call; see auto-release.yml for the full
#    DAG). No release: published event is involved, so the caller
#    must pass the newly-pushed tag explicitly via the `tag` input.
#    Consumers rarely write this themselves — auto-release.yml wires
#    it up. See docs/design/chained-workflows.md for why.
#
# When pinned with @v0 (or any ref), the action scripts are pulled from
# forgesworn/anvil at the same SHA as this workflow — there is
# no floating @main reference, so v0-pinned consumers get deterministic
# behaviour until they bump the pin.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used for npm operations (must ship with npm >= 11.5.x for OIDC trusted publishing)
        required: false
        type: string
        default: '24.11.0'
      registry-url:
        description: npm registry URL
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      test-command:
        description: Command that runs the full test suite
        required: false
        type: string
        default: 'npm test'
      vector-test-command:
        description: Command for the frozen-vector gate (empty to skip)
        required: false
        type: string
        default: ''
      changelog-file:
        description: Path to CHANGELOG.md
        required: false
        type: string
        default: 'CHANGELOG.md'
      package-json:
        description: Path to package.json
        required: false
        type: string
        default: 'package.json'
      audit-level:
        description: npm audit level
        required: false
        type: string
        default: 'low'
      strict-action-pins:
        description: >-
          If "true" (the default), verify-action-pins fails the release on
          any unpinned `uses:` reference in .github/workflows. Set to
          "false" for warn-only mode. forgesworn/anvil is exempt
          by name.
        required: false
        type: string
        default: 'true'
      version-strategy:
        description: |
          How version bumps are validated. One of:
            - manual (default): you bump package.json and tag; the action
              verifies the tag matches and publishes.
            - verify: you bump manually, but the action parses conventional
              commits and fails if your bump is smaller than what the commit
              history implies (e.g. feat commits but only a patch bump).
        required: false
        type: string
        default: 'manual'
      reproducibility-mode:
        description: |
          Reproducible-build attestation mode. One of:
            - strict (default): two independent builds must produce
              byte-identical tarballs; mismatch fails the release.
            - warn: two builds run; a mismatch is warned but the
              release proceeds with build-A.
            - off: skip the second build entirely; behaves like v0.3.
        required: false
        type: string
        default: 'strict'
      dry-run:
        description: If "true", skip the real publish
        required: false
        type: string
        default: 'false'
      debug:
        description: If "true", run a diagnostic step before publish that dumps npm version, redacted .npmrc, OIDC env vars, and npm config. Useful for debugging trusted-publisher setup issues. Off by default.
        required: false
        type: string
        default: 'false'
      tag:
        description: >-
          Release tag to publish (e.g. "v1.2.3"). When set, the workflow
          uses this as the checkout ref and passes it to verify-tag and
          update-release. When empty, falls back to
          github.event.release.tag_name (legacy release: published
          trigger path). Set this when chaining from auto-release.yml,
          which pushes a tag inside the same run and must pass it
          explicitly because the default GITHUB_TOKEN-created events do
          not fire their own workflow runs.
        required: false
        type: string
        default: ''
    secrets:
      JSR_TOKEN:
        description: JSR publishing token (required only if jsr.json exists)
        required: false

jobs:
  build-a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTION_SRC: .anvil
      PACKAGE_JSON: ${{ inputs.package-json }}
      # Precedence: explicit `tag` input (chained flow) > release-event
      # tag_name (legacy manual flow) > GITHUB_REF_NAME (step scripts
      # fall back to this in lib if both are empty).
      GIT_TAG: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
      filename: ${{ steps.record.outputs.filename }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On chained calls github.ref is the outer run's ref (usually
          # refs/heads/main). Explicitly check out the tag that was just
          # pushed so we build the tagged SHA, not HEAD of main.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Checkout anvil at pinned SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: forgesworn/anvil
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false

      - name: Setup Node with OIDC registry
        # v6 handles the OIDC-no-token case correctly; earlier versions
        # write a placeholder _authToken that short-circuits the OIDC
        # exchange in npm 11.5+.
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      # Node 24.11.0 ships with an npm that supports OIDC trusted
      # publishing. Earlier Node versions (22 LTS ships 10.9.x) do not.

      - name: Verify action pins
        env:
          STRICT_ACTION_PINS: ${{ inputs.strict-action-pins == 'true' && '1' || '0' }}
        run: $ACTION_SRC/steps/verify-action-pins.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Verify tag matches package.json
        run: $ACTION_SRC/steps/verify-tag.sh

      - name: Verify bump matches commit history
        if: ${{ inputs.version-strategy == 'verify' }}
        run: $ACTION_SRC/steps/verify-bump.sh

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: $ACTION_SRC/steps/run-tests.sh

      - name: Verify frozen vectors
        env:
          VECTOR_TEST_COMMAND: ${{ inputs.vector-test-command }}
        run: $ACTION_SRC/steps/verify-vectors.sh

      - name: Verify runtime audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: $ACTION_SRC/steps/verify-audit.sh

      - name: Verify exports map
        run: $ACTION_SRC/steps/verify-exports.sh

      - name: Verify no secrets in artefacts
        run: $ACTION_SRC/steps/verify-secrets.sh

      - name: Record tarball integrity
        id: record
        env:
          TARBALL_META_DIR: ${{ runner.temp }}/forgesworn-anvil
        run: |
          set -euo pipefail
          $ACTION_SRC/steps/record-tarball.sh
          meta="${TARBALL_META_DIR}/tarball.meta"
          sha256="$(grep '^sha256=' "$meta" | cut -d= -f2-)"
          filename="$(grep '^filename=' "$meta" | cut -d= -f2-)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload tarball-A artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-A
          path: ${{ runner.temp }}/forgesworn-anvil
          retention-days: 1
          if-no-files-found: error

  build-b:
    if: ${{ inputs.reproducibility-mode != 'off' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTION_SRC: .anvil
      PACKAGE_JSON: ${{ inputs.package-json }}
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Match build-a's ref so both runners pack the same tree.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Checkout anvil at pinned SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: forgesworn/anvil
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Record tarball integrity
        id: record
        env:
          TARBALL_META_DIR: ${{ runner.temp }}/forgesworn-anvil
        run: |
          set -euo pipefail
          $ACTION_SRC/steps/record-tarball.sh
          meta="${TARBALL_META_DIR}/tarball.meta"
          sha256="$(grep '^sha256=' "$meta" | cut -d= -f2-)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload tarball-B artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-B
          path: ${{ runner.temp }}/forgesworn-anvil
          retention-days: 1
          if-no-files-found: error

  reproduce:
    if: ${{ inputs.reproducibility-mode != 'off' }}
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      reproducible: ${{ steps.compare.outputs.reproducible }}
    steps:
      - name: Checkout anvil at pinned SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: forgesworn/anvil
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false

      - name: Download tarball-A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball-A
          path: ${{ runner.temp }}/tarball-A

      - name: Download tarball-B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball-B
          path: ${{ runner.temp }}/tarball-B

      - name: Compare tarball metadata
        id: compare
        env:
          STRICT: ${{ inputs.reproducibility-mode == 'strict' && '1' || '0' }}
        run: ./steps/compare-tarball-meta.sh "${{ runner.temp }}/tarball-A/tarball.meta" "${{ runner.temp }}/tarball-B/tarball.meta"

  publish:
    needs: [build-a, reproduce]
    if: |
      always() &&
      needs.build-a.result == 'success' &&
      (needs.reproduce.result == 'success' || needs.reproduce.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      ACTION_SRC: .anvil
      PACKAGE_JSON: ${{ inputs.package-json }}
      CHANGELOG_FILE: ${{ inputs.changelog-file }}
      GIT_TAG: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
      DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # update-release.sh calls `git rev-parse HEAD` to supply
          # --target when creating a Release; that resolves to the
          # tagged commit because we check out the tag here.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Checkout anvil at pinned SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: forgesworn/anvil
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false

      - name: Setup Node with OIDC registry
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Download canonical tarball (build-A)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball-A
          path: ${{ runner.temp }}/forgesworn-anvil

      # Gated behind `debug: true`. When a consumer hits the classic
      # "OIDC token exchange error - package not found" (or similar),
      # flipping this on and re-running surfaces enough environmental
      # ground-truth to diagnose trusted-publisher misconfiguration,
      # npm-version mismatch, or missing OIDC env vars without having
      # to fork the action. Does not print token values.
      - name: Diagnose npm auth configuration (debug)
        if: ${{ inputs.debug == 'true' }}
        run: |
          set -euo pipefail
          echo "npm version: $(npm --version)"
          echo "which npm: $(which npm)"
          echo "node: $(node --version)"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
            echo "--- userconfig .npmrc (redacted) ---"
            sed -E 's/(_authToken|_password|_auth|username)[[:space:]]*=.*/\1=<REDACTED>/' "$NPM_CONFIG_USERCONFIG"
            echo "--- end ---"
          fi
          echo "NODE_AUTH_TOKEN present: ${NODE_AUTH_TOKEN:+yes}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS:-<unset>}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "--- npm config list (credentials redacted) ---"
          npm config list 2>/dev/null | sed -E 's/(_authToken|_password|_auth|username)[[:space:]]*=.*/\1 = <REDACTED>/' || true

      - name: Publish to npm
        run: $ACTION_SRC/steps/publish-npm.sh

      - name: Publish to JSR (if jsr.json exists)
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: $ACTION_SRC/steps/publish-jsr.sh

      - name: Update GitHub Release body from CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPRODUCIBLE: ${{ needs.reproduce.outputs.reproducible == '1' && '1' || '0' }}
        run: $ACTION_SRC/steps/update-release.sh
