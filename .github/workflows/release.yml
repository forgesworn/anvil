name: release

# Reusable workflow consumers call from their own release.yml.
# This is the primary documented surface — the composite action exists
# as a power-user escape hatch only.
#
# Caller example:
#
#   name: release
#   on:
#     release:
#       types: [published]
#   permissions:
#     contents: write
#     id-token: write
#   jobs:
#     release:
#       uses: forgesworn/release-action/.github/workflows/release.yml@v0
#       with:
#         vector-test-command: npm run test:vectors
#
# When pinned with @v0 (or any ref), the action scripts are pulled from
# forgesworn/release-action at the same SHA as this workflow — there is
# no floating @main reference, so v0-pinned consumers get deterministic
# behaviour until they bump the pin.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used for npm operations (must ship with npm >= 11.5.x for OIDC trusted publishing)
        required: false
        type: string
        default: '24.11.0'
      registry-url:
        description: npm registry URL
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      test-command:
        description: Command that runs the full test suite
        required: false
        type: string
        default: 'npm test'
      vector-test-command:
        description: Command for the frozen-vector gate (empty to skip)
        required: false
        type: string
        default: ''
      changelog-file:
        description: Path to CHANGELOG.md
        required: false
        type: string
        default: 'CHANGELOG.md'
      package-json:
        description: Path to package.json
        required: false
        type: string
        default: 'package.json'
      audit-level:
        description: npm audit level
        required: false
        type: string
        default: 'low'
      dry-run:
        description: If "true", skip the real publish
        required: false
        type: string
        default: 'false'
    secrets:
      JSR_TOKEN:
        description: JSR publishing token (required only if jsr.json exists)
        required: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_JSON: ${{ inputs.package-json }}
      CHANGELOG_FILE: ${{ inputs.changelog-file }}
      GIT_TAG: ${{ github.event.release.tag_name }}
      DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
      # Path where we check out release-action sources. Using a dot
      # prefix so it sorts out of the way and never collides with a
      # consumer path.
      ACTION_SRC: .release-action
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout release-action at pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: forgesworn/release-action
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false

      - name: Setup Node with OIDC registry
        # v6 handles the OIDC-no-token case correctly; earlier versions
        # write a placeholder _authToken that short-circuits the OIDC
        # exchange in npm 11.5+.
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      # Node 24.11.0 ships with an npm that supports OIDC trusted
      # publishing. Earlier Node versions (22 LTS ships 10.9.x) do not,
      # and self-upgrading npm mid-workflow is fragile — we tried.
      # Matching paulmillr/jsbt's pinned default here.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Verify tag matches package.json
        run: $ACTION_SRC/steps/verify-tag.sh

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: $ACTION_SRC/steps/run-tests.sh

      - name: Verify frozen vectors
        env:
          VECTOR_TEST_COMMAND: ${{ inputs.vector-test-command }}
        run: $ACTION_SRC/steps/verify-vectors.sh

      - name: Verify runtime audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: $ACTION_SRC/steps/verify-audit.sh

      - name: Verify exports map
        run: $ACTION_SRC/steps/verify-exports.sh

      - name: Verify no secrets in artefacts
        run: $ACTION_SRC/steps/verify-secrets.sh

      # Clear setup-node's placeholder _authToken from the effective
      # .npmrc so npm 11.5+ OIDC exchange initiates instead of trying
      # to authenticate with XXXXX-XXXXX-XXXXX-XXXXX (which fails with
      # a misleading 404 from the registry).
      - name: Clear npmrc placeholder auth for OIDC
        run: |
          set -euo pipefail
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"
            echo "Cleared _authToken from $NPM_CONFIG_USERCONFIG"
          fi

      # Diagnostic: dump the effective .npmrc and relevant auth env vars
      # so any future "why is my publish failing" investigation has
      # ground-truth in the logs. Does not print token values.
      - name: Diagnose npm auth configuration
        run: |
          echo "npm version: $(npm --version)"
          echo "which npm: $(which npm)"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
            echo "--- userconfig .npmrc (redacted) ---"
            sed 's/\(_authToken=\).*/\1<REDACTED>/' "$NPM_CONFIG_USERCONFIG"
            echo "--- end ---"
          fi
          echo "NODE_AUTH_TOKEN present: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ''
        run: $ACTION_SRC/steps/publish-npm.sh

      - name: Publish to JSR (if jsr.json exists)
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: $ACTION_SRC/steps/publish-jsr.sh

      - name: Update GitHub Release body from CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: $ACTION_SRC/steps/update-release.sh
