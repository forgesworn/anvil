# Companion workflow: automatic version determination from conventional
# commits. Runs on push to the release branch, parses commits since the
# last tag, and if a release is warranted, bumps package.json, updates
# CHANGELOG, tags, pushes, and publishes — all inside one CI run.
#
# This is the "auto" mode -- the zero-dependency replacement for
# semantic-release. Use it if you want CI to decide the version number.
# If you prefer manual control, skip this workflow entirely and use
# release.yml directly.
#
# DAG:
#
#     determine (parse commits, decide bump)
#         │
#         ▼  (if should_release == 'true')
#     commit-and-tag (bump package.json, commit, tag, push)
#         │
#         ▼
#     publish (uses: release.yml via workflow_call)
#         ├── build-a (gates)
#         ├── build-b (reproduce)
#         ├── reproduce (compare)
#         └── publish (npm + GitHub Release create)
#
# The `publish` job delegates to release.yml via workflow_call, not an
# event trigger. This matters: GitHub's anti-recursion rule suppresses
# workflow runs from events created by the default GITHUB_TOKEN (tag
# pushes, release creations), so event-based chaining would require a
# PAT. workflow_call is not an event, so the rule does not apply — one
# human push to main produces one workflow run, end-to-end, no PAT.
# See docs/design/chained-workflows.md for the full rationale.
#
# Usage in your repo:
#
#   name: auto-release
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#     id-token: write
#   jobs:
#     auto-release:
#       uses: forgesworn/anvil/.github/workflows/auto-release.yml@v0
#       with:
#         vector-test-command: npm run test:vectors  # optional
#
# That's it. Push conventional commits to main, releases happen
# automatically when warranted. You do not need a separate release.yml
# in your repo — this workflow chains into release.yml internally.

name: auto-release

on:
  workflow_call:
    inputs:
      release-branch:
        description: Branch that triggers releases
        type: string
        default: main
      package-json:
        description: Path to package.json
        type: string
        default: package.json
      changelog-file:
        description: Path to CHANGELOG.md
        type: string
        default: CHANGELOG.md
      dry-run:
        description: Determine version and changelog but do not commit, tag, or publish
        type: string
        default: 'false'
      # ---------------------------------------------------------------
      # Inputs plumbed through to release.yml via the chained publish job.
      # These match release.yml's inputs and preserve its defaults when
      # omitted. Callers who used to set these on a separate release.yml
      # caller now set them here.
      # ---------------------------------------------------------------
      node-version:
        description: Node version used for npm operations (must ship with npm >= 11.5.x for OIDC)
        type: string
        default: '24.11.0'
      test-command:
        description: Command that runs the full test suite
        type: string
        default: 'npm test'
      vector-test-command:
        description: Command for the frozen-vector gate (empty to skip)
        type: string
        default: ''
      audit-level:
        description: npm audit level
        type: string
        default: 'low'
      strict-action-pins:
        description: If 'true', fail the release on any unpinned action reference in .github/workflows
        type: string
        default: 'true'
      reproducibility-mode:
        description: One of strict, warn, off (see release.yml)
        type: string
        default: 'strict'
      debug:
        description: If 'true', dump npm/OIDC diagnostics before publish
        type: string
        default: 'false'
    secrets:
      GH_TOKEN:
        description: |
          Deprecated. Previously required as a PAT or GitHub App token to
          bridge the auto-release → release.yml event gap. The chained
          workflow now calls release.yml via workflow_call, so no PAT is
          needed. The secret declaration is kept for backwards
          compatibility — if set, it is silently ignored in the chained
          publish path. Safe to remove from caller workflows.
        required: false
      JSR_TOKEN:
        description: JSR publishing token (required only if jsr.json exists)
        required: false

jobs:
  determine:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTION_SRC: .anvil
    outputs:
      bump: ${{ steps.parse.outputs.bump }}
      next_version: ${{ steps.parse.outputs.next_version }}
      changelog: ${{ steps.parse.outputs.changelog }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # full history for tag resolution
          persist-credentials: false

      - name: Checkout anvil at pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: forgesworn/anvil
          ref: ${{ github.job_workflow_sha }}
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false

      - name: Parse conventional commits
        id: parse
        env:
          PACKAGE_JSON: ${{ inputs.package-json }}
        run: $ACTION_SRC/steps/parse-commits.sh

      - name: Decide whether to release
        id: decide
        env:
          BUMP: ${{ steps.parse.outputs.bump }}
          NEXT_VERSION: ${{ steps.parse.outputs.next_version }}
        run: |
          if [[ "$BUMP" == "none" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since last tag."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Release warranted: ${BUMP} bump -> ${NEXT_VERSION}"
          fi

  commit-and-tag:
    needs: determine
    if: needs.determine.outputs.should_release == 'true' && inputs.dry-run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN is sufficient now — we no longer
          # need an event trigger to fire downstream, so the
          # anti-recursion rule is irrelevant. GH_TOKEN is accepted as
          # a deprecated override but not required.
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        env:
          NEXT_VERSION: ${{ needs.determine.outputs.next_version }}
          PACKAGE_JSON: ${{ inputs.package-json }}
        run: |
          pkg="${PACKAGE_JSON:-package.json}"
          tmp="$(mktemp)"
          jq --arg v "$NEXT_VERSION" '.version = $v' "$pkg" > "$tmp"
          mv "$tmp" "$pkg"
          echo "Bumped $pkg to $NEXT_VERSION"

      - name: Update CHANGELOG
        env:
          NEXT_VERSION: ${{ needs.determine.outputs.next_version }}
          CHANGELOG: ${{ needs.determine.outputs.changelog }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        run: |
          changelog_file="${CHANGELOG_FILE:-CHANGELOG.md}"
          date_today="$(date -u +%Y-%m-%d)"
          heading="## ${NEXT_VERSION} (${date_today})"

          if [[ ! -f "$changelog_file" ]]; then
            {
              echo "# Changelog"
              echo ""
              echo "$heading"
              echo ""
              echo "$CHANGELOG"
            } > "$changelog_file"
          else
            # Insert new section after the first top-level heading
            tmp="$(mktemp)"
            inserted=false
            while IFS= read -r line; do
              echo "$line" >> "$tmp"
              if ! $inserted && [[ "$line" =~ ^#\  ]]; then
                {
                  echo ""
                  echo "$heading"
                  echo ""
                  echo "$CHANGELOG"
                } >> "$tmp"
                inserted=true
              fi
            done < "$changelog_file"

            if ! $inserted; then
              {
                echo "$heading"
                echo ""
                echo "$CHANGELOG"
                echo ""
                cat "$changelog_file"
              } > "$tmp"
            fi

            mv "$tmp" "$changelog_file"
          fi

          echo "Updated $changelog_file with $NEXT_VERSION section"

      - name: Commit, tag, and push
        id: tag
        env:
          NEXT_VERSION: ${{ needs.determine.outputs.next_version }}
          PACKAGE_JSON: ${{ inputs.package-json }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        run: |
          pkg="${PACKAGE_JSON:-package.json}"
          changelog_file="${CHANGELOG_FILE:-CHANGELOG.md}"

          git add "$pkg" "$changelog_file"

          # Include lock file if it exists and changed
          if [[ -f "package-lock.json" ]] && ! git diff --quiet package-lock.json 2>/dev/null; then
            git add package-lock.json
          fi

          git commit -m "chore(release): ${NEXT_VERSION}"
          git tag "v${NEXT_VERSION}"
          git push origin HEAD --follow-tags
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    # Chain directly into release.yml via workflow_call. This is the
    # critical architectural hook: no event trigger, no PAT, one run.
    # The self-reference `@v0` pins release.yml to the same major as
    # auto-release.yml's caller pin. Consumers who bump their pin
    # upgrade both workflows together.
    needs: [determine, commit-and-tag]
    if: needs.determine.outputs.should_release == 'true' && inputs.dry-run != 'true'
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.commit-and-tag.outputs.tag }}
      package-json: ${{ inputs.package-json }}
      changelog-file: ${{ inputs.changelog-file }}
      node-version: ${{ inputs.node-version }}
      test-command: ${{ inputs.test-command }}
      vector-test-command: ${{ inputs.vector-test-command }}
      audit-level: ${{ inputs.audit-level }}
      strict-action-pins: ${{ inputs.strict-action-pins }}
      reproducibility-mode: ${{ inputs.reproducibility-mode }}
      debug: ${{ inputs.debug }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  dry-run-summary:
    needs: determine
    if: needs.determine.outputs.should_release == 'true' && inputs.dry-run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dry-run summary
        env:
          NEXT_VERSION: ${{ needs.determine.outputs.next_version }}
          CHANGELOG: ${{ needs.determine.outputs.changelog }}
          BUMP: ${{ needs.determine.outputs.bump }}
        run: |
          echo "## Dry run: would release v${NEXT_VERSION} (${BUMP} bump)"
          echo ""
          echo "### Changelog"
          echo "$CHANGELOG"
