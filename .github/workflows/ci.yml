name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run shellcheck on step scripts
        run: |
          set -euo pipefail
          # Ubuntu runners ship with shellcheck preinstalled.
          shellcheck --version
          # -x follows sourced files (lib.sh).
          shellcheck -x steps/*.sh

  bats:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats smoke tests
        run: bats test/*.bats
