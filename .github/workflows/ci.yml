name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run shellcheck on step scripts
        run: |
          set -euo pipefail
          # Ubuntu runners ship with shellcheck preinstalled.
          shellcheck --version
          # -x follows sourced files (lib.sh).
          shellcheck -x steps/*.sh

  bats:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats smoke tests
        run: bats test/*.bats
