name: anvil
description: >-
  Supply-chain-hardened npm publish for JS/TS libraries. OIDC trusted
  publishing, SLSA provenance, secret scan, exports check,
  frozen-vector gate, action-pin auditing. Zero dependencies, pure
  bash, auditable in thirty minutes.
author: forgesworn

branding:
  icon: package
  color: purple

inputs:
  node-version:
    description: Node version used for npm operations (must ship with npm >= 11.5.x for OIDC trusted publishing)
    required: false
    default: '24.11.0'
  registry-url:
    description: npm registry URL for publishes
    required: false
    default: 'https://registry.npmjs.org'
  test-command:
    description: Command that runs the full test suite
    required: false
    default: 'npm test'
  vector-test-command:
    description: Command for the frozen-vector gate (empty to skip)
    required: false
    default: ''
  changelog-file:
    description: Path to CHANGELOG.md
    required: false
    default: 'CHANGELOG.md'
  package-json:
    description: Path to package.json
    required: false
    default: 'package.json'
  audit-level:
    description: npm audit level (low|moderate|high|critical)
    required: false
    default: 'low'
  strict-action-pins:
    description: >-
      If "true" (the default), verify-action-pins fails the release on
      any unpinned `uses:` reference in .github/workflows. Set to
      "false" for warn-only mode. forgesworn/anvil is exempt
      by name.
    required: false
    default: 'true'
  lifecycle-scripts-policy:
    description: |
      How verify-lifecycle-scripts handles preinstall/install/postinstall
      hooks in the published package. One of:
        - warn (default): unpermitted hooks are logged but publish continues.
        - strict: unpermitted hooks fail the release.
        - off: skip the gate entirely.
      Install-time hooks run on every consumer's machine when they
      `npm install` the package — the attack surface used in the April
      2026 Bitwarden CLI compromise. Allow specific hooks via
      `allowed-lifecycle-scripts`.
    required: false
    default: 'warn'
  allowed-lifecycle-scripts:
    description: >-
      JSON object mapping hook name (preinstall/install/postinstall) to
      the exact command string permitted. Anything else warns or fails
      depending on `lifecycle-scripts-policy`. Empty map (default) means
      no install hooks are allowed. Example:
      {"postinstall": "node-gyp rebuild"}
    required: false
    default: '{}'
  version-strategy:
    description: |
      How version bumps are validated. One of:
        - manual (default): you bump package.json and tag; the action
          verifies the tag matches and publishes.
        - verify: you bump manually, but the action parses conventional
          commits and fails if your bump is smaller than what the commit
          history implies (e.g. feat commits but only a patch bump).
    required: false
    default: 'manual'
  dry-run:
    description: If "true", skip the real publish (for smoke-testing)
    required: false
    default: 'false'
  debug:
    description: If "true", run a diagnostic step before publish that dumps npm version, redacted .npmrc, OIDC env vars, and `npm config list`. Off by default. Useful for debugging trusted-publisher setup.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      # v6 handles the OIDC-no-token case correctly; earlier versions
      # write a placeholder _authToken that short-circuits the OIDC
      # exchange in npm 11.5+.
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Verify action pins
      shell: bash
      env:
        STRICT_ACTION_PINS: ${{ inputs.strict-action-pins == 'true' && '1' || '0' }}
      run: ${{ github.action_path }}/steps/verify-action-pins.sh

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build --if-present

    - name: Verify tag matches package.json
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
        GIT_TAG: ${{ github.event.release.tag_name }}
      run: ${{ github.action_path }}/steps/verify-tag.sh

    - name: Verify bump matches commit history
      if: ${{ inputs.version-strategy == 'verify' }}
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
        GIT_TAG: ${{ github.event.release.tag_name }}
      run: ${{ github.action_path }}/steps/verify-bump.sh

    - name: Run tests
      shell: bash
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
      run: ${{ github.action_path }}/steps/run-tests.sh

    - name: Verify frozen vectors
      shell: bash
      env:
        VECTOR_TEST_COMMAND: ${{ inputs.vector-test-command }}
      run: ${{ github.action_path }}/steps/verify-vectors.sh

    - name: Verify runtime audit
      shell: bash
      env:
        AUDIT_LEVEL: ${{ inputs.audit-level }}
      run: ${{ github.action_path }}/steps/verify-audit.sh

    - name: Verify exports map
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
      run: ${{ github.action_path }}/steps/verify-exports.sh

    - name: Verify no secrets in artefacts
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
      run: ${{ github.action_path }}/steps/verify-secrets.sh

    - name: Verify lifecycle scripts
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
        LIFECYCLE_POLICY: ${{ inputs.lifecycle-scripts-policy }}
        ALLOWED_LIFECYCLE_SCRIPTS: ${{ inputs.allowed-lifecycle-scripts }}
      run: ${{ github.action_path }}/steps/verify-lifecycle-scripts.sh

    - name: Record tarball integrity
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
      run: ${{ github.action_path }}/steps/record-tarball.sh

    # Gated behind `debug: true`. When a consumer hits an opaque
    # trusted-publisher error, flipping this on surfaces environmental
    # ground-truth (npm version, redacted .npmrc, OIDC env var presence,
    # `npm config list`) without having to fork the action. Does not
    # print token values.
    - name: Diagnose npm auth configuration (debug)
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "npm version: $(npm --version)"
        echo "which npm: $(which npm)"
        echo "node: $(node --version)"
        echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
        if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
          echo "--- userconfig .npmrc (redacted) ---"
          sed -E 's/(_authToken|_password|_auth|username)[[:space:]]*=.*/\1=<REDACTED>/' "$NPM_CONFIG_USERCONFIG"
          echo "--- end ---"
        fi
        echo "NODE_AUTH_TOKEN present: ${NODE_AUTH_TOKEN:+yes}"
        echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS:-<unset>}"
        echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
        echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
        echo "--- npm config list (credentials redacted) ---"
        npm config list 2>/dev/null | sed -E 's/(_authToken|_password|_auth|username)[[:space:]]*=.*/\1 = <REDACTED>/' || true

    - name: Publish to npm
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
      run: ${{ github.action_path }}/steps/publish-npm.sh

    - name: Publish to JSR (if jsr.json exists)
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
        JSR_TOKEN: ${{ env.JSR_TOKEN }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '0' }}
      run: ${{ github.action_path }}/steps/publish-jsr.sh

    - name: Update GitHub Release body from CHANGELOG
      shell: bash
      env:
        GIT_TAG: ${{ github.event.release.tag_name }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        PACKAGE_JSON: ${{ inputs.package-json }}
        GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/steps/update-release.sh
