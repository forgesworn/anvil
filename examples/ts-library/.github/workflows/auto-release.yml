# Auto-release caller for forgesworn/anvil.
# Place this in YOUR library at .github/workflows/auto-release.yml.
# Requires a sibling release.yml with a workflow_dispatch trigger +
# tag input — see the sample release.yml in this example.
#
# On push to main, this workflow parses conventional commits since
# the last tag, and if a release is warranted, bumps package.json,
# updates CHANGELOG, tags, pushes, and dispatches release.yml to
# publish. One push → one auto-release run → one dispatched release
# run. No PAT required.
#
# If you prefer manual control, delete this file and use the sibling
# release.yml directly.

name: auto-release
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write            # required to dispatch release.yml

jobs:
  auto-release:
    uses: forgesworn/anvil/.github/workflows/auto-release.yml@v0
