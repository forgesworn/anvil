# Release pipeline for forgesworn/anvil.
# Place this in YOUR library at .github/workflows/release.yml.
#
# Two triggers:
#   release: published   - manual flow, you create the GitHub Release
#   workflow_dispatch    - auto flow, auto-release.yml dispatches here
#
# Configure npm trusted publishing for THIS workflow file (not
# forgesworn/anvil) — the OIDC workflow_ref claim is the entry-point.
# Both triggers land on this same workflow, so one trusted-publisher
# row covers both flows.
#
# The reusable workflow handles: tests, vector gate, npm audit,
# exports check, secret scan, action-pin audit, reproducible build
# (two-runner), OIDC-authenticated npm publish, and GitHub Release
# body update / create.

name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    with:
      tag: ${{ inputs.tag || '' }}
      vector-test-command: npm run test:vectors
