  <!-- === Illustration: Two runners converging through a shield gate === -->

  <!-- Runner A (top-left server box) -->
  <g transform="translate(140, 180)">
    <!-- Server body -->
    <rect x="0" y="0" width="120" height="80" rx="6" fill="url(#steel)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="24" rx="6" fill="url(#steelLight)"/>
    <rect x="0" y="18" width="120" height="6" fill="url(#steelLight)"/>
    <!-- Status lights -->
    <circle cx="16" cy="12" r="4" fill="#22c55e" opacity="0.9"/>
    <circle cx="30" cy="12" r="4" fill="#22c55e" opacity="0.6"/>
    <circle cx="44" cy="12" r="4" fill="#475569"/>
    <!-- Drive bays -->
    <rect x="10" y="34" width="100" height="6" rx="1" fill="#1e293b"/>
    <rect x="10" y="46" width="100" height="6" rx="1" fill="#1e293b"/>
    <rect x="10" y="58" width="100" height="6" rx="1" fill="#1e293b"/>
    <!-- Label -->
    <text x="60" y="76" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" opacity="0.6">build-a</text>
  </g>

  <!-- Runner B (bottom-left server box) -->
  <g transform="translate(140, 370)">
    <!-- Server body -->
    <rect x="0" y="0" width="120" height="80" rx="6" fill="url(#steel)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="24" rx="6" fill="url(#steelLight)"/>
    <rect x="0" y="18" width="120" height="6" fill="url(#steelLight)"/>
    <!-- Status lights -->
    <circle cx="16" cy="12" r="4" fill="#22c55e" opacity="0.9"/>
    <circle cx="30" cy="12" r="4" fill="#22c55e" opacity="0.6"/>
    <circle cx="44" cy="12" r="4" fill="#475569"/>
    <!-- Drive bays -->
    <rect x="10" y="34" width="100" height="6" rx="1" fill="#1e293b"/>
    <rect x="10" y="46" width="100" height="6" rx="1" fill="#1e293b"/>
    <rect x="10" y="58" width="100" height="6" rx="1" fill="#1e293b"/>
    <!-- Label -->
    <text x="60" y="76" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" opacity="0.6">build-b</text>
  </g>

  <!-- Converging lines from runners to shield -->
  <g stroke="url(#amber)" stroke-width="2" fill="none" opacity="0.7">
    <!-- From runner A -->
    <line x1="260" y1="220" x2="340" y2="300"/>
    <!-- From runner B -->
    <line x1="260" y1="410" x2="340" y2="330"/>
  </g>

  <!-- Hash comparison symbol (= sign between lines) -->
  <g transform="translate(290, 300)">
    <rect x="0" y="0" width="16" height="3" rx="1" fill="#f59e0b" opacity="0.8"/>
    <rect x="0" y="7" width="16" height="3" rx="1" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Central shield (the gate) -->
  <g transform="translate(350, 240)" filter="url(#glow)">
    <!-- Shield glow -->
    <ellipse cx="60" cy="75" rx="70" ry="85" fill="url(#shieldGlow)"/>
    <!-- Shield body -->
    <path d="M60,10 L105,35 L105,85 Q105,130 60,150 Q15,130 15,85 L15,35 Z"
          fill="#1e293b" stroke="url(#amber)" stroke-width="2.5"/>
    <!-- Inner shield detail -->
    <path d="M60,25 L92,44 L92,82 Q92,118 60,135 Q28,118 28,82 L28,44 Z"
          fill="none" stroke="url(#amberDark)" stroke-width="1" opacity="0.5"/>
    <!-- Checkmark inside shield -->
    <polyline points="42,78 55,95 82,58" fill="none" stroke="url(#amberLight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Output arrow from shield to publish -->
  <g stroke="url(#amber)" stroke-width="2" fill="none" opacity="0.7">
    <line x1="470" y1="315" x2="510" y2="315"/>
    <!-- Arrowhead -->
    <polygon points="510,308 525,315 510,322" fill="url(#amber)" stroke="none" opacity="0.7"/>
  </g>

  <!-- npm package box (publish output) -->
  <g transform="translate(530, 280)">
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#1e293b" stroke="url(#amberDark)" stroke-width="1.5"/>
    <!-- npm-style box icon -->
    <rect x="18" y="18" width="34" height="34" rx="2" fill="none" stroke="url(#amber)" stroke-width="2"/>
    <rect x="26" y="26" width="8" height="18" fill="url(#amber)"/>
    <rect x="38" y="26" width="8" height="10" fill="url(#amber)"/>
    <!-- Label -->
    <text x="35" y="66" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" opacity="0.6">publish</text>
  </g>

  <!-- Gate labels (floating, subtle) -->
  <g font-family="'SF Mono', monospace" font-size="8" fill="#64748b" opacity="0.4">
    <text x="380" y="210">sha256 match</text>
    <text x="345" y="420">secret scan</text>
    <text x="345" y="435">exports check</text>
    <text x="345" y="450">vector gate</text>
  </g>

  <!-- Divider -->
  <g transform="translate(590, 220)">
    <line x1="0" y1="0" x2="0" y2="200" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="0" x2="6" y2="200" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <!-- Shield icon between divider lines -->
    <g transform="translate(-4, 88)" fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M7,2 L13,5 L13,10 Q13,14 7,16 Q1,14 1,10 L1,5 Z" fill="#1e293b"/>
      <polyline points="4,10 6,12.5 10,7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Title -->
  <text x="660" y="310" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Menlo', monospace" font-size="48" font-weight="bold" fill="#f8fafc">anvil</text>

  <!-- Tagline -->
  <text x="660" y="350" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">forge-hardened npm publishing. reproducible builds.</text>

  <!-- Keyword ticker -->
  <text y="622" font-family="'SF Mono', monospace" font-size="12" fill="#94a3b8" opacity="0.06">
    <tspan x="20">OIDC</tspan>
    <tspan dx="20">TRUSTED-PUBLISHING</tspan>
    <tspan dx="20">REPRODUCIBLE-BUILDS</tspan>
    <tspan dx="20">SLSA</tspan>
    <tspan dx="20">PROVENANCE</tspan>
    <tspan dx="20">SECRET-SCAN</tspan>
    <tspan dx="20">EXPORTS-CHECK</tspan>
    <tspan dx="20">VECTOR-GATE</tspan>
    <tspan dx="20">NPM-AUDIT</tspan>
    <tspan dx="20">ACTION-PINS</tspan>
    <tspan dx="20">PURE-BASH</tspan>
    <tspan dx="20">ZERO-DEPS</tspan>
  </text>
</svg>
